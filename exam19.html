<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
</head>
<style>
    h1 { text-align: center;}
    .disp { width: 205px; height: 40px; margin-top: 3px;}
    .disp { text-align: right; font-family: "Oxanium", sans-serif; font-size: 22pt;}
    input[type=button] {width: 50px; height: 50px; margin-top: 5px;
        text-align: center; vertical-align: middle; }
    #calc { width: 220px; margin-left: auto; margin-right: auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function(){

       // 추가: 숫자와 연산자를 저장할 변수
       let num1 = "";
       let num2 = "";
       let op = "";

       $(".num").click(function(){
            let cur =$("#disp2").val();
            let n = $(this).val();

            // 추가: 첫 번째 숫자와 두 번째 숫자 구분
            if(op == ""){
                num1 = num1 + n;
            }
            else {
                num2 = num2 + n;
            }

            $("#disp2").val(cur+n);
       });

       $(".op").click(function(){
            let cur =$("#disp2").val();
            let n = $(this).val();
            if(n != "=") {

                // 추가: 연산자 저장
                if(num1 != "" && op == ""){
                    op = n;
                    $("#disp2").val(cur+n);
                }

            }
            else {

                // 수정: eval() 대신 사칙연산 직접 계산
                if(num1 != "" && num2 != "" && op != ""){
                    let a = Number(num1);
                    let b = Number(num2);
                    let result;

                    if(op == "+"){
                        result = a + b;
                    }
                    else if(op == "-"){
                        result = a - b;
                    }
                    else if(op == "*"){
                        result = a * b;
                    }
                    else if(op == "/"){
                        if(b == 0){
                            result = "오류";
                        }
                        else {
                            result = a / b;
                        }
                    }

                    $("#disp1").val(cur);
                    $("#disp2").val(result);

                    // 추가: 다음 계산을 위한 변수 초기화
                    num1 = "";
                    num2 = "";
                    op = "";

                    if(result != "오류"){
                        num1 = String(result);
                    }
                }
            }
       });

       // 추가: AC 버튼을 누르면 초기화
       $(".func").click(function(){
            num1 = "";
            num2 = "";
            op = "";

            $("#disp1").val("");
            $("#disp2").val("");
       });

    });
</script>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type ="text" class="disp" id="disp1" readonly>
            <input type ="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>
</body>
</html>
